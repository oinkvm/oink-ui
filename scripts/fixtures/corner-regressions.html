<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<title>圆角回归</title>
<style>
body { margin: 0; background: white; }
.tile { position: absolute; left: 40px; top: 40px; width: 180px; height: 100px; background: #eee; border-radius: 24px; corner-shape: superellipse(1.75); --ok-shape: superellipse(1.75); }
#reference { left: 300px; corner-shape: round; --ok-shape: round; }
.dashed { outline: 2px dashed blue; outline-offset: 3px; }
.pseudo::after { content: ""; position: absolute; inset: 0; border-radius: inherit; corner-shape: inherit; --ok-shape: inherit; outline: 2px dashed blue; outline-offset: 3px; }
.dotted { outline: 2px dotted blue; outline-offset: 3px; }
.square { border-top-right-radius: 0; border-bottom-right-radius: 0; box-shadow: 0 0 0 2px white, 0 0 0 4px blue; }
.focus { box-shadow: inset 0 0 0 2px transparent; outline: none; }
.focus:focus { box-shadow: inset 0 0 0 2px blue; }
.fade { outline: none; box-shadow: 0 0 0 2px white, 0 0 0 4px transparent; transition: box-shadow 240ms linear; }
.geometry { outline: none; box-shadow: none; transition: box-shadow 240ms linear; }
.geometry:focus { box-shadow: 0 0 0 4px blue; }
.fade:focus { box-shadow: 0 0 0 2px white, 0 0 0 4px blue; }
</style>
<div id="target" class="tile" tabindex="0"></div><div id="reference" class="tile"></div>
<script type="module">
import '../../src/styles/base.css';
import { installCornerFallback } from '../../src/core/cornerFallback';
window.stopFallback = installCornerFallback();
window.ready = true;
</script>
</html>
